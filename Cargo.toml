[package]
name = "jsonschema-for-toml"
version = "0.1.0"
edition = "2024"
authors = ["foolishell"]
description = "A command-line tool for validating TOML files against JSON Schema."
license = "MIT"
repository = "https://github.com/foolishell/jsonschema-for-toml"
keywords = ["jsonschema", "toml", "validation"]
categories = ["command-line-tools"]
readme = "README.md"

[dependencies]
anyhow = "1.0.86"
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
toml = "0.8.12"
jsonschema = "0.29.1"

[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.0"
